name: Custom Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MPP_FILE=$(find patches/build/libs -maxdepth 1 -name "patches-*.mpp" | head -n 1)
          TAG="v1.0.${{ github.run_number }}"
          echo "Publishing $MPP_FILE as $TAG"
          gh release create "$TAG" "$MPP_FILE" --title "Custom Piko NewX $TAG" --notes "Automated custom patches build ($TAG)"    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove upstream Instagram patches
        run: |
          find patches/src/main/kotlin/app/crimera/patches/instagram -type f ! -path '*/utils/Constants.kt' ! -path '*/misc/actionBar/leftAlignDirectInboxTitle/LeftAlignDirectInboxTitlePatch.kt' -delete
          find patches/src/main/kotlin/app/crimera/patches/instagram -type d -empty -delete
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Remove upstream Crimera Instagram patches, keep custom patches only"
            git push
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build patches
        run: ./gradlew build --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MPP_FILE=$(find patches/build/libs -maxdepth 1 -name "patches-*.mpp" | head -n 1)
          TAG="v1.0.${{ github.run_number }}"
          echo "Publishing $MPP_FILE as $TAG"
          gh release create "$TAG" "$MPP_FILE" --title "Custom Piko NewX $TAG" --notes "Automated custom patches build ($TAG)"
