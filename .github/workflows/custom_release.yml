name: Custom Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:generatePatches -x compileTestKotlin -x test -x lint --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MPP_FILE=$(find patches/build/libs -maxdepth 1 -name "patches-*.mpp" | head -n 1)
          TAG="v1.0.${{ github.run_number }}"
          echo "Publishing $MPP_FILE as $TAG"
          gh release create "$TAG" "$MPP_FILE" --title "Custom Piko NewX $TAG" --notes "Automated custom patches build ($TAG)"
