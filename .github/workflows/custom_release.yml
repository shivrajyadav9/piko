name: Custom Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove upstream Instagram patches
        run: |
          find patches/src/main/kotlin/app/crimera/patches/instagram -type f \
            ! -path '*/utils/Constants.kt' \
            ! -path '*/misc/actionBar/leftAlignDirectInboxTitle/LeftAlignDirectInboxTitlePatch.kt' \
            -delete
          find patches/src/main/kotlin/app/crimera/patches/instagram -type d -empty -delete
           if [ -n "$(git status --porcelain)" ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove upstream Crimera Instagram patches, keep custom patches only"
          git push
         fi
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew clean buildAndroid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          MPP_FILE=$(ls patches/build/libs/*.mpp | head -n 1)
          gh release create "$TAG" "$MPP_FILE" \
            --title "Custom Piko NewX $TAG" \
            --notes "Custom NewX patches: Home timeline gear button & Drawer Piko settings icon"
