name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "classes2.dex" -d /tmp/dex
          DEXDUMP=$(command -v dexdump || find /usr/local/lib/android -name dexdump 2>/dev/null | sort -V | tail -n 1)
          "$DEXDUMP" -d /tmp/dex/classes2.dex > /tmp/dd.txt
          python3 -c "import re,subprocess,glob; exec('\n'.join([\"c=m=None;refs=[];clss=[]\",\"for l in open('/tmp/dd.txt',errors='ignore'):\",\" if 'Class descriptor' in l: c=l.split(chr(39))[1];m=None\",\" elif l.strip().startswith('name') and ':' in l: m=l.split(chr(39))[1]\",\" if 'LX/01kK;' in l and c and c!='LX/01kK;':\",\"  k=(c,m or '<class>')\",\"  if k not in refs: refs.append(k)\",\"  if c not in clss: clss.append(c)\",\"print('=== REFS ===')\",\"for x,y in refs: print(x,'->',y)\",\"for i,c in enumerate(clss[:3]):\",\" jc=c[1:-1].replace('/','.')\",\" print('=== DECOMPILE',jc,'===')\",\" subprocess.run(['/tmp/jadx/bin/jadx','--rename-flags','none','--single-class',jc,'-d',f'/tmp/o{i}','/tmp/dex/classes2.dex'])\",\" for f in glob.glob(f'/tmp/o{i}/**/*.java',recursive=True):\",\"  ls=open(f).read().splitlines()\",\"  ix=[j for j,ln in enumerate(ls) if '01kK' in ln or 'A0V' in ln]\",\"  rg=[]\",\"  for j in ix:\",\"   a,b=max(0,j-20),min(len(ls),j+21)\",\"   if rg and a<=rg[-1][1]: rg[-1][1]=max(rg[-1][1],b)\",\"   else: rg.append([a,b])\",\"  for a,b in rg:\",\"   print(f'--- {f} lines {a+1}-{b} ---')\",\"   for j in range(a,b): print(f'{j+1}: {ls[j]}')\"] ))"
