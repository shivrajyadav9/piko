name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "classes2.dex" "classes3.dex" -d /tmp/dex
          export DEXDUMP=$(command -v dexdump || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name dexdump 2>/dev/null | sort -V | tail -n 1)
          for c in X.02cT X.03qZ X.00sN; do for d in classes2.dex classes3.dex; do rm -rf /tmp/j; /tmp/jadx/bin/jadx --rename-flags "none" --single-class "$c" -d /tmp/j "/tmp/dex/$d" >/dev/null 2>&1 || true; f=$(find /tmp/j -name "*.java" 2>/dev/null | head -n 1); if [ -s "$f" ]; then echo "=== $c ($d) ==="; if [ "$c" = "X.00sN" ]; then head -n 120 "$f"; else cat "$f"; fi; fi; done; done; echo "=== DEXDUMP 3f4ccccd ==="; "$DEXDUMP" -d /tmp/dex/classes2.dex | awk '/Class descriptor/{cls=$0} /name +:/{m=$0} /3f4ccccd/{if(cls ~ /MediaExtKt|X\/00sN|X\/02cT|com\/instagram\/feed\//) print "DEX_MATCH:", cls, "|", m, "|", $0}'
          
