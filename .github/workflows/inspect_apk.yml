name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "*.dex" -d /tmp/dex
          python3 -c '
          import subprocess, os, glob; subprocess.run(["/tmp/jadx/bin/jadx", "-d", "/tmp/jadx_out", "--no-res", "--no-imports", "--show-bad-code", "/tmp/dex/classes2.dex"]); p = "/tmp/jadx_out/sources/X/C08tL.java"; print("=== C08tL.java ===", os.path.exists(p)); s = open(p).read() if os.path.exists(p) else ""; idx = s.find("C065701yZ") if "C065701yZ" in s else s.find("case 45:"); start = max(0, idx - 500) if idx >= 0 else 0; print(s[start:start+6000]); print("=== DEX SEARCH ==="); [print("FOUND IN:", d, "count:", open(d, "rb").read().count(b"MobileConfigUnsafeContext")) for d in sorted(glob.glob("/tmp/dex/*.dex")) if b"MobileConfigUnsafeContext" in open(d, "rb").read()]; subprocess.run(["/tmp/jadx/bin/jadx", "-d", "/tmp/jadx_out_c1", "--no-res", "--no-imports", "--show-bad-code", "/tmp/dex/classes.dex"]); print("=== IMPL CLASSES ==="); [print(os.path.join(r, f), [l.strip()[:200] for l in open(os.path.join(r, f), errors="ignore").read().splitlines() if "class " in l or "MobileConfigUnsafeContext" in l or "Bae(long" in l]) for rd in ["/tmp/jadx_out", "/tmp/jadx_out_c1"] for r, _, fs in os.walk(rd) for f in fs if f.endswith(".java") and any(k in open(os.path.join(r, f), errors="ignore").read() for k in ["implements com.facebook.mobileconfig.factory.MobileConfigUnsafeContext", "implements MobileConfigUnsafeContext", "Bae(long"])]
          '
          
