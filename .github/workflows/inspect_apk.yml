name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "classes2.dex" "classes3.dex" -d /tmp/dex
          export DEXDUMP=$(command -v dexdump || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name dexdump 2>/dev/null | sort -V | tail -n 1)
          python3 -c 'exec("""import os,subprocess\ndd=os.environ["DEXDUMP"]\nms=[]\nfor d in ["classes2.dex","classes3.dex"]:\n p=f"/tmp/dex/{d}"\n if not os.path.exists(p):continue\n out=subprocess.run([dd,"-d",p],capture_output=True,text=True,errors="replace").stdout\n c=m=None;b=[]\n def fl():\n  if not c or not m:return\n  s=chr(10).join(b)\n  tc=any(t in c for t in ("MediaExtKt","X/00sN","X/03rF","X.00sN","X.03rF"))\n  h8=("3f4ccccd" in s or "0.8" in s)\n  ha=any(k in s for k in ("Math/max","Math.max","coerceAtLeast","getAspectRatio","02cT","LITHO_MEDIA_CONTENT"))\n  if (tc and (h8 or ha)) or (h8 and ha):ms.append((p,c,m))\n for l in out.splitlines():\n  if l.startswith("Class descriptor  :"):fl();c=l.split(chr(39))[1];m=None;b=[]\n  elif l.lstrip().startswith("#") and " : (in " in l:fl();m=l.strip();b=[]\n  elif m is not None:b.append(l)\n fl()\nprint(f"Matches: {len(ms)}")\nfor p,c,m in ms[:30]:print(os.path.basename(p),c,m)\nseen=set()\nfor p,c,_ in ms:\n jc=c.lstrip("L").rstrip(";").replace("/",".")\n if jc in seen:continue\n seen.add(jc);od=f"/tmp/jo_{len(seen)}"\n subprocess.run(["/tmp/jadx/bin/jadx","--rename-flags","none","--single-class",jc,"-d",od,p],capture_output=True)\n print(f"=== {jc} ({os.path.basename(p)}) ===")\n for r,_,fs in os.walk(od):\n  for fn in fs:\n   if fn.endswith(".java"):\n    ls=open(os.path.join(r,fn),errors="replace").read().splitlines()\n    hs=[i for i,l in enumerate(ls) if "0.8" in l or "3f4ccccd" in l]\n    for i in (hs[:2] if hs else [0]):\n     for k in range(max(0,i-12),min(len(ls),i+13)):print(f"{k+1}: {ls[k]}")\n if len(seen)>=3:break""")'
