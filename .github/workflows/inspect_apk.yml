name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "classes*.dex" -d /tmp/dex
          echo "=== RES XML ==="; unzip -l "$BASE_APK" | grep -E "row_feed_profile_header|tall_video|overlay_header" || true; BASE_APK="$BASE_APK" python3 -c 'import glob,os,re,zipfile; dfs=sorted(glob.glob("/tmp/dex/classes*.dex")); print("DEX_COUNT:",len(dfs)); cp=re.compile(rb"Lcom/instagram/[A-Za-z0-9_/$]+;"); sp=re.compile(rb"[A-Za-z0-9_.:/-]*(?:tall_video|overlay_header|header_overlay|immersive_video|feed_tall|clips_in_feed|media_header_overlay|tall_media)[A-Za-z0-9_.:/-]*"); cs,ss=set(),set(); [(cs.update(m.decode("utf-8","ignore") for m in cp.findall(d) if any(a in m.lower() for a in (b"feed",b"mainfeed",b"media")) and any(b in m.lower() for b in (b"tall",b"overlay",b"header",b"immersive",b"aspect"))), ss.update(m.decode("utf-8","ignore") for m in sp.findall(d))) for d in (open(p,"rb").read() for p in dfs)]; print("=== CLASS MATCHES ===",len(cs)); print("\n".join(sorted(cs)[:60])); print("=== DEX STRING MATCHES ===",len(ss)); print("\n".join(sorted(ss)[:60])); z=zipfile.ZipFile(os.environ["BASE_APK"]); arsc=z.read("resources.arsc") if "resources.arsc" in z.namelist() else b""; ap=re.compile(rb"[A-Za-z0-9_.:/-]*(?:row_feed_profile_header|tall_video|overlay_header)[A-Za-z0-9_.:/-]*"); am={m.decode("utf-8","ignore") for m in ap.findall(arsc)}; print("=== ARSC MATCHES ===",len(am)); print("\n".join(sorted(am)[:60]))'
