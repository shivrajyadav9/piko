name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" classes.dex classes2.dex -d /tmp/dex
          mkdir -p /tmp/o1 /tmp/o2 /tmp/o3; /tmp/jadx/bin/jadx --rename-flags "none" --single-class X.02pg -d /tmp/o1 /tmp/dex/classes.dex || true; [ -z "$(find /tmp/o1 -name '*.java')" ] && /tmp/jadx/bin/jadx --rename-flags "none" --single-class X.02pg -d /tmp/o1 /tmp/dex/classes2.dex || true; /tmp/jadx/bin/jadx --rename-flags "none" --single-class X.05qv -d /tmp/o2 /tmp/dex/classes.dex || true; [ -z "$(find /tmp/o2 -name '*.java')" ] && /tmp/jadx/bin/jadx --rename-flags "none" --single-class X.05qv -d /tmp/o2 /tmp/dex/classes2.dex || true; /tmp/jadx/bin/jadx --rename-flags "none" --single-class com.instagram.feed.media.Media -d /tmp/o3 /tmp/dex/classes2.dex || true; [ -z "$(find /tmp/o3 -name '*.java')" ] && /tmp/jadx/bin/jadx --rename-flags "none" --single-class com.instagram.feed.media.Media -d /tmp/o3 /tmp/dex/classes.dex || true; echo "=== X.02pg (334-365) ==="; find /tmp/o1 -name "*.java" -exec awk 'NR>=334 && NR<=365 {printf "%d: %s\n", NR, $0}' {} + || true; echo "=== X.05qv ==="; find /tmp/o2 -name "*.java" -exec nl -ba {} + || true; echo "=== Media (13725-13815) ==="; find /tmp/o3 -name "*.java" -exec awk 'NR>=13725 && NR<=13815 {printf "%d: %s\n", NR, $0}' {} + || true; echo "=== Media (3260-3275, 5395-5410, 6425-6440) ==="; find /tmp/o3 -name "*.java" -exec awk '(NR>=3260 && NR<=3275) || (NR>=5395 && NR<=5410) || (NR>=6425 && NR<=6440) {printf "%d: %s\n", NR, $0}' {} + || true
