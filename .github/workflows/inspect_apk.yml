name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
                    mkdir -p /tmp/dex /tmp/jadx_out && unzip -q -o "$BASE_APK" "classes*.dex" -d /tmp/dex && for c in X.08vA X.03ce; do echo "=== $c ==="; /tmp/jadx/bin/jadx --rename-flags "none" --single-class "$c" -d /tmp/jadx_out "$BASE_APK" || true; f="/tmp/jadx_out/sources/${c//.//}.java"; [ -f "$f" ] && cat "$f" || echo "NOT FOUND: $f"; done && DEXDUMP=$(command -v dexdump || find /usr/local/lib/android/sdk/build-tools -name dexdump 2>/dev/null | head -n1) && "$DEXDUMP" -d /tmp/dex/classes.dex > /tmp/dex1.txt && python3 -c 'import re; t=open("/tmp/dex1.txt",errors="replace").read(); cs=t.split("\nClass #"); print("=== X.03cu.A01 ==="); [print(m) for c in cs[1:] if "LX/03cu;" in c for m in re.findall(r"#\d+\s+:\s+\(in LX/03cu;\)\s+name\s+:\s+\x27A01\x27.*?(?=\n\s+#|\n\s+Virtual methods|\Z)",c,re.S)]'
