name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "*.dex" -d /tmp/dex
          python3 -c '
          import subprocess, os
          for dn in ["classes.dex", "classes2.dex", "classes4.dex"]:
              p = "/tmp/dex/" + dn 
              if not os.path.exists(p): continue
              out = "/tmp/jadx_out_" + dn
              subprocess.run(["/tmp/jadx/bin/jadx", "-d", out, "--no-res", "--no-imports", p], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              for root, _, files in os.walk(out):
                  for fn in sorted(files):
                      if not fn.endswith(".java") or fn == "C02sV.java" or fn.startswith("AnonymousClass000") or fn.startswith("C000"): continue

                      fp = os.path.join(root, fn)
                      txt = open(fp, errors="ignore").read()
                      idx = txt.find("02sV")
                      if idx != -1:
                          print("=== MATCH FILE:", fp, dn, "===")
                          print(txt[max(0, idx - 1500):min(len(txt), idx + 2000)])
          '
          
