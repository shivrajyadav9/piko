name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex && unzip -q -o "$BASE_APK" "classes*.dex" -d /tmp/dex && DEXDUMP=$(command -v dexdump || find /usr/local/lib/android/sdk/build-tools -name dexdump 2>/dev/null | head -n 1) && python3 -c 'import glob,os,re,subprocess; dex_bin=subprocess.check_output("command -v dexdump || find /usr/local/lib/android/sdk/build-tools -name dexdump 2>/dev/null | head -n 1",shell=True,text=True).strip(); frags=["fragment_feed","fragment_search","fragment_clips","fragment_direct_tab","fragment_profile"]; tabs=["feed_tab","for_you_tab","bottom_tab"]; fy=["FOR_YOU","FOLLOWING","FAVORITES"]; tc=["FEED","CLIPS","DIRECT","SEARCH","PROFILE"]; needles=[b"LX/03cu;",b"feed_tab",b"for_you_tab",b"bottom_tab",b"fragment_feed",b"FOR_YOU"]; [print("=== REF ===",os.path.basename(d),m.group(1),"03cu=",c.count("LX/03cu;"),"frags=",[k for k in frags if k in c],"tabs=",[k for k in tabs if k in c.lower()],"fy=",[k for k in fy if k in c]) or [print(" ",l) for l in c.splitlines() if any(w in l for w in ["Class descriptor","Superclass","name          :","LX/03cu;"]+frags+tabs+fy)][:80] for d in sorted(glob.glob("/tmp/dex/classes*.dex")) if any(n in open(d,"rb").read() for n in needles) for c in subprocess.check_output([dex_bin,"-d",d],text=True,errors="replace").split("\nClass #")[1:] for m in [re.search(r"Class descriptor\s+:\s+\x27([^\x27]+)\x27",c)] if m and m.group(1)!="LX/0000;" and (c.count("LX/03cu;")>=3 or sum(k in c for k in frags)>=2 or any(k in c.lower() for k in tabs) or ("Ljava/lang/Enum;" in c and any(k in c for k in fy) and any(k in c for k in tc)))]' && exit 0 && unzip -q -o "$BASE_APK" "classes*.dex" -d /tmp/dex && DEXDUMP=$(command -v dexdump || find /usr/local/lib/android/sdk/build-tools -name dexdump 2>/dev/null | head -n 1) && python3 -c 'import glob,os,re,subprocess; dex_bin=subprocess.check_output("command -v dexdump || find /usr/local/lib/android/sdk/build-tools -name dexdump 2>/dev/null | head -n 1",shell=True,text=True).strip(); frags=["fragment_feed","fragment_search","fragment_clips","fragment_direct_tab","fragment_profile"]; enums=["FOR_YOU","FOLLOWING","FAVORITES","FEED","CLIPS","DIRECT","SEARCH","PROFILE"]; extra=["feed_tab","for_you_tab","bottom_tab"]; needles=[k.encode() for k in frags+extra+["FOR_YOU"]]; found=set(); [print("=== ENUM/TAB ===",os.path.basename(d),m.group(1),"frags=",fh,"enums=",eh) or [print(" ",l) for l in c.splitlines() if any(w in l for w in ["Class descriptor","Superclass","Static fields","name          :","const-string","sput-object"]+frags+enums)] or found.add(m.group(1)) if ((("Ljava/lang/Enum;" in c or len(eh)>=3) and (len(fh)>=2 or len(eh)>=3)) or len(fh)>=3) else (print("=== TAB REF ===",os.path.basename(d),m.group(1),"frags=",fh,"extra=",xh) or [print(" ",l) for l in c.splitlines() if any(w in l for w in ["Class descriptor","name          :","const-string"]+frags+extra)]) if (len(fh)>=2 or xh) else None for d in sorted(glob.glob("/tmp/dex/classes*.dex")) if any(n in open(d,"rb").read() for n in needles) for c in subprocess.check_output([dex_bin,"-d",d],text=True,errors="replace").split("\nClass #")[1:] for m in [re.search(r"Class descriptor\s+:\s+\x27([^\x27]+)\x27",c)] if m for fh in [[k for k in frags if k in c]] for eh in [[k for k in enums if ("\""+k+"\"" in c or "\x27"+k+"\x27" in c or " "+k+":" in c)]] for xh in [[k for k in extra if k in c.lower()]]]; print("FOUND_ENUMS:",sorted(found)); [print("=== ENUM_REF ===",os.path.basename(d),m.group(1),"ref=",ec) or [print(" ",l) for l in c.splitlines() if ec in l or "name          :" in l or "Class descriptor" in l] for d in sorted(glob.glob("/tmp/dex/classes*.dex")) if found and any(ec.encode() in open(d,"rb").read() for ec in found) for c in subprocess.check_output([dex_bin,"-d",d],text=True,errors="replace").split("\nClass #")[1:] for m in [re.search(r"Class descriptor\s+:\s+\x27([^\x27]+)\x27",c)] if m and m.group(1) not in found for ec in found if c.count(ec)>=4]' && exit 0
          unzip -q -o "$BASE_APK" "classes2.dex" "classes3.dex" -d /tmp/dex
          DEXDUMP=$(command -v dexdump || find /usr/local/lib/android/sdk/build-tools -name dexdump 2>/dev/null | sort -V | tail -n 1)
          python3 -c 'import glob,re,subprocess,sys; exec("""\nd=sys.argv[1]\nfs=sorted(glob.glob("/tmp/dex/classes*.dex"),key=lambda s:(len(s),s))\ntg=("LX/03cu;.A0D","LX/03cu;.A0B","fragment_feed_switcher","merged_feed")\ntb=("LX/03cu;.A0C","LX/03cu;.A08","LX/03cu;.A0A","LX/03cu;.A0F")\nq=chr(39)\nfor f in fs:\n p=subprocess.Popen([d,"-d",f],stdout=subprocess.PIPE,text=True,errors="replace")\n c=""; b=[]\n def fl():\n  if not b: return\n  k="".join(b)\n  if any(t in k for t in tg):\n   mn=re.search(rf"name\\s+:\\s+{q}([^{q}]*){q}",k)\n   mt=re.search(rf"type\\s+:\\s+{q}([^{q}]*){q}",k)\n   sg=(mn.group(1) if mn else "?")+(mt.group(1) if mt else "")\n   mc=[l.strip() for l in b if "const-wide" in l and re.search(r"(?:0x|#|\\b)8[123][0-9a-fA-F]{6,}",l,re.I)]\n   cu=[l.strip() for l in b if "LX/03cu;" in l]\n   print(f"[REF] {f} | {c} | {sg}")\n   for x in mc: print("  MC:",x)\n   for x in cu: print("  03cu:",x)\n  if all(t in k for t in tb):\n   print(f"=== TAB_BUILDER {f} | {c} ===")\n   print(k)\n for l in p.stdout:\n  if l.startswith("Class descriptor"):\n   fl(); b=[]\n   m=re.search(rf"{q}([^{q}]+){q}",l)\n   c=m.group(1) if m else l.strip()\n  elif re.match(r"^    #\\d+\\s+:\\s+\\(in ",l):\n   fl(); b=[l]\n  elif b:\n   b.append(l)\n fl(); p.wait()\n""")' "$DEXDUMP"
