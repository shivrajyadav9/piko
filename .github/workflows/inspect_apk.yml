name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'
      search_term:
        description: 'String or class to inspect in DEX'
        required: false
        default: 'PrebindActionBar'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk
          PKG="${{ inputs.package_id }}"
          VER="${{ inputs.version }}"
          if [ -n "$VER" ]; then
            /tmp/apkeep -a "${PKG}@${VER}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk || \
            /tmp/apkeep -a "${PKG}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          else
            /tmp/apkeep -a "${PKG}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          fi
          ls -lh /tmp/apk
          mkdir -p /tmp/extracted
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do
            [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted
          done
          for f in /tmp/apk/*.apk; do
            [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk
          done
          ls -lh /tmp/extracted

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          echo "BASE_APK=$BASE_APK"
          if [ -f /tmp/extracted/manifest.json ]; then
            head -n 25 /tmp/extracted/manifest.json
          fi

         

          echo "=== EXTRACTING TARGET DEX ==="
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "*.dex" -d /tmp/dex
          python3 - << 'PY'
                  exec('import glob, subprocess, os\ntargets = [b"feed_timeline_following", b"feed_timeline_favorites", b"title_logo_chevron", b"main_feed_switcher"]\nfor p in sorted(glob.glob("/tmp/dex/*.dex")):\n\tdata = open(p, "rb").read()\n\thits = [t.decode() for t in targets if t in data]\n\tif ("feed_timeline_following" in hits and "feed_timeline_favorites" in hits) or "title_logo_chevron" in hits or "main_feed_switcher" in hits:\n\t\tprint("MATCH", hits, "in", os.path.basename(p))\nfor dn in ["classes2.dex", "classes4.dex", "classes5.dex"]:\n\tp = "/tmp/dex/" + dn\n\tif not os.path.exists(p): continue\n\tout = "/tmp/jadx_out_" + dn\n\tsubprocess.run(["/tmp/jadx/bin/jadx", "-d", out, "--no-res", "--no-imports", p], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)\n\tfor root, _, files in os.walk(out):\n\t\tfor fn in sorted(files):\n\t\t\tif not fn.endswith(".java") or fn.startswith("AnonymousClass000") or fn.startswith("C000"): continue\n\t\t\tfp = os.path.join(root, fn)\n\t\t\ttxt = open(fp, errors="ignore").read()\n\t\t\tif ("feed_timeline_following" in txt and "feed_timeline_favorites" in txt) or "title_logo_chevron" in txt or ("FOLLOWING" in txt and "FAVORITES" in txt and "FOR_YOU" in txt):\n\t\t\t\tprint("=== MATCH FILE:", fp, dn, "===")\n\t\t\t\tprint(txt[:6000])\n')
          PY
