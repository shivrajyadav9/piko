name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
                /tmp/jadx/bin/jadx --rename-flags "none" --single-class X.08bl -d /tmp/jadx_out "$BASE_APK" || true; echo "=== 08bl.java ==="; cat /tmp/jadx_out/sources/X/08bl.java || true; /tmp/jadx/bin/jadx --rename-flags "none" --single-class X.03bi -d /tmp/jadx_out "$BASE_APK" || true; echo "=== 03bi.java ==="; cat /tmp/jadx_out/sources/X/03bi.java || true; /tmp/jadx/bin/jadx --rename-flags "none" --single-class com.instagram.ui.swipenavigation.container.SwipeNavigationContainer -d /tmp/jadx_out "$BASE_APK" || true; echo "=== SwipeNavigationContainer.java ==="; python3 -c 'lines=open("/tmp/jadx_out/sources/com/instagram/ui/swipenavigation/container/SwipeNavigationContainer.java").readlines(); [print("--- "+m+" ---\n"+"".join(lines[i:i+180])) for m in ("onInterceptTouchEvent","onTouchEvent") for i,l in enumerate(lines) if "boolean "+m in l and "(" in l]' || true
                
