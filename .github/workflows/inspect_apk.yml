name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" classes.dex classes2.dex -d /tmp/dex
          mkdir -p /tmp/o1 /tmp/o2 /tmp/o3 /tmp/o4; unzip -q -o "$BASE_APK" "classes*.dex" -d /tmp/dex; echo "=== X.05yu ==="; /tmp/jadx/bin/jadx --rename-flags "none" --single-class X.05yu -d /tmp/o1 /tmp/dex/classes.dex || true; find /tmp/o1 -name "*.java" -exec cat {} + || true; echo "=== X.02pg ==="; /tmp/jadx/bin/jadx --rename-flags "none" --single-class X.02pg -d /tmp/o2 /tmp/dex/classes.dex || true; find /tmp/o2 -name "*.java" -exec grep -n -C 5 -E "572719583|feed_items" {} + || true; echo "=== Media ==="; /tmp/jadx/bin/jadx --rename-flags "none" --single-class com.instagram.feed.media.Media -d /tmp/o3 /tmp/dex/classes2.dex || true; find /tmp/o3 -name "*.java" -exec grep -n -E "08rX|A08" {} + | head -n 10 || true; find /tmp/o3 -name "*.java" -exec grep -n -E "A6K|A6O|A6M" {} + || true; echo "=== X.08rX ==="; for d in $(grep -al "LX/08rX;" /tmp/dex/classes*.dex); do echo "Trying $d"; /tmp/jadx/bin/jadx --rename-flags "none" --single-class X.08rX -d /tmp/o4 "$d" 2>/dev/null || true; if [ -n "$(find /tmp/o4 -name '*.java')" ]; then echo "FOUND IN $d"; break; fi; done; find /tmp/o4 -name "*.java" -exec grep -n -E "A6K|A6O|A6M|A8O" {} + || true
