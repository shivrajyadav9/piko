name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "classes*.dex" -d /tmp/dex
          echo "=== RES XML ==="; unzip -l "$BASE_APK" | grep -E "row_feed_profile_header|tall_video|overlay_header" || true; BASE_APK="$BASE_APK" python3 -c 'import glob,os,re,zipfile; dfs=sorted(glob.glob("/tmp/dex/classes*.dex")); print("DEX_COUNT:",len(dfs)); cp=re.compile(rb"Lcom/instagram/[A-Za-z0-9_/$]+;"); sp=re.compile(rb"[A-Za-z0-9_.:/-]*(?:tall_video|overlay_header|header_overlay|immersive_video|feed_tall|clips_in_feed|media_header_overlay|tall_media)[A-Za-z0-9_.:/-]*"); cs,ss=set(),set(); [(cs.update(m.decode("utf-8","ignore") for m in cp.findall(d) if any(a in m.lower() for a in (b"feed",b"mainfeed",b"media")) and any(b in m.lower() for b in (b"tall",b"overlay",b"header",b"immersive",b"aspect"))), ss.update(m.decode("utf-8","ignore") for m in sp.findall(d))) for d in (open(p,"rb").read() for p in dfs)]; print("=== CLASS MATCHES ===",len(cs)); print("\n".join(sorted(cs)[:60])); print("=== DEX STRING MATCHES ===",len(ss)); print("\n".join(sorted(ss)[:60])); z=zipfile.ZipFile(os.environ["BASE_APK"]); arsc=z.read("resources.arsc") if "resources.arsc" in z.namelist() else b""; ap=re.compile(rb"[A-Za-z0-9_.:/-]*(?:row_feed_profile_header|tall_video|overlay_header)[A-Za-z0-9_.:/-]*"); am={m.decode("utf-8","ignore") for m in ap.findall(arsc)}; print("=== ARSC MATCHES ===",len(am)); print("\n".join(sorted(am)[:60]))'
          python3 -c 'exec("import glob,os,struct,subprocess\nts=[b\"is_tall_video\",b\"TALL_VIDEO\",b\"MEDIA_HEADER\",b\"IMMERSIVE_VIDEO\",b\"isTallVideo\"]\njt=[]\nseen=set()\ndef uleb(d,p):\n v=s=0\n while True:\n  b=d[p];p+=1;v|=(b&127)<<s\n  if b<128:return v,p\n  s+=7\ndef gs(d,so,i):\n p=struct.unpack_from(\"<I\",d,so+i*4)[0]\n while d[p]>=128:p+=1\n p+=1;e=d.find(bytes([0]),p)\n return d[p:e].decode(\"utf-8\",\"replace\")\nfor dp in sorted(glob.glob(\"/tmp/dex/classes*.dex\")):\n fn=os.path.basename(dp);d=open(dp,\"rb\").read()\n if not any(t in d for t in ts):continue\n ss,so,tys,tyo,_,_,_,_,ms,mo,cs,co=struct.unpack_from(\"<12I\",d,56)\n ti=None\n for i in range(ss):\n  p=struct.unpack_from(\"<I\",d,so+i*4)[0]\n  while d[p]>=128:p+=1\n  p+=1;e=d.find(bytes([0]),p);raw=d[p:e]\n  if raw==ts[0]:ti=i\n  if any(t in raw for t in ts[1:]):print(\"STR:\",fn,raw.decode(\"utf-8\",\"replace\"))\n if ti is None:continue\n for ci in range(cs):\n  cidx,_,_,_,_,_,cdo,_=struct.unpack_from(\"<8I\",d,co+ci*32)\n  if not cdo:continue\n  p=cdo;sf,p=uleb(d,p);inf,p=uleb(d,p);dm,p=uleb(d,p);vm,p=uleb(d,p)\n  for _ in range((sf+inf)*2):_,p=uleb(d,p)\n  for cnt in (dm,vm):\n   mi=0\n   for _ in range(cnt):\n    df,p=uleb(d,p);_,p=uleb(d,p);coff,p=uleb(d,p);mi+=df\n    if not coff:continue\n    isz=struct.unpack_from(\"<I\",d,coff+12)[0];ip=coff+16;eip=ip+isz*2;hit=False\n    while ip<eip:\n     w0=struct.unpack_from(\"<H\",d,ip)[0];op=w0&255\n     if w0==256:ip+=(4+struct.unpack_from(\"<H\",d,ip+2)[0]*2)*2\n     elif w0==512:ip+=(2+struct.unpack_from(\"<H\",d,ip+2)[0]*4)*2\n     elif w0==768:ip+=(4+(struct.unpack_from(\"<H\",d,ip+2)[0]*struct.unpack_from(\"<I\",d,ip+4)[0]+1)//2)*2\n     elif op==26:\n      if struct.unpack_from(\"<H\",d,ip+2)[0]==ti:hit=True\n      ip+=4\n     elif op==27:\n      if struct.unpack_from(\"<I\",d,ip+2)[0]==ti:hit=True\n      ip+=6\n     elif op==24:ip+=10\n     elif op in (250,251):ip+=8\n     elif op in (3,6,9,20,23,36,37,38,42,43,44,252,253) or 110<=op<=114 or 116<=op<=120:ip+=6\n     elif op in (2,5,8,19,21,22,25,28,31,32,34,35,41,254,255) or 45<=op<=61 or 68<=op<=109 or 144<=op<=175 or 208<=op<=226:ip+=4\n     else:ip+=2\n    if hit:\n     cd=gs(d,so,struct.unpack_from(\"<I\",d,tyo+cidx*4)[0])\n     cn=cd[1:-1].replace(\"/\",\".\") if cd.startswith(\"L\") else cd\n     mn=gs(d,so,struct.unpack_from(\"<I\",d,mo+mi*8+4)[0])\n     print(\"REF:\",fn,cn,mn)\n     if cn not in seen:seen.add(cn);jt.append((dp,cn))\nfor idx,(dp,cn) in enumerate(jt[:5]):\n od=\"/tmp/j\"+str(idx)\n subprocess.run([\"/tmp/jadx/bin/jadx\",\"--rename-flags\",\"none\",\"--single-class\",cn,\"-d\",od,dp],check=False)\n print(\"=== JADX\",cn,\"===\")\n for r,_,fs in os.walk(od):\n  for f in fs:\n   if f.endswith(\".java\"):\n    ls=open(os.path.join(r,f),errors=\"replace\").readlines()\n    for li,ln in enumerate(ls):\n     if \"is_tall_video\" in ln:\n      for k in range(max(0,li-5),min(len(ls),li+6)):print(k+1,ls[k].rstrip())\n      print(\"---\")\n")'
