name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "classes*.dex" -d /tmp/dex
          python3 -c 'exec("import struct,subprocess,os,glob\ndef uleb(d,p):\n r=s=0\n while 1:\n  b=d[p];p+=1;r|=(b&127)<<s\n  if not(b&128):return r,p\n  s+=7\ndef gs(d,so,i):\n o=struct.unpack_from(\"<I\",d,so+i*4)[0]\n _,p=uleb(d,o)\n return d[p:d.index(0,p)].decode(\"utf-8\",\"replace\")\nsubprocess.run([\"/tmp/jadx/bin/jadx\",\"--rename-flags\",\"none\",\"--single-class\",\"X.00WG\",\"-d\",\"/tmp/j0\",\"/tmp/dex/classes2.dex\"])\nprint(\"=== X.00WG new 00WG( ===\")\nfor r,_,fs in os.walk(\"/tmp/j0\"):\n for fn in fs:\n  if fn.endswith(\".java\"):\n   for ln in open(os.path.join(r,fn),errors=\"replace\"):\n    if \"new 00WG(\" in ln:print(ln.rstrip())\nprint(\"=== LX/00WG;->A0h:LX/00WG; ===\")\nms=[]\nfor dp in sorted(glob.glob(\"/tmp/dex/classes*.dex\")):\n d=open(dp,\"rb\").read()\n ss,so=struct.unpack_from(\"<II\",d,56)\n ts,to=struct.unpack_from(\"<II\",d,64)\n fs,fo=struct.unpack_from(\"<II\",d,80)\n ms_,mo=struct.unpack_from(\"<II\",d,88)\n cs,co=struct.unpack_from(\"<II\",d,96)\n wt=next((ti for ti in range(ts) if gs(d,so,struct.unpack_from(\"<I\",d,to+ti*4)[0])==\"LX/00WG;\"),None)\n if wt is None:continue\n tf=next((fi for fi in range(fs) if struct.unpack_from(\"<HHI\",d,fo+fi*8)[:2]==(wt,wt) and gs(d,so,struct.unpack_from(\"<HHI\",d,fo+fi*8)[2])==\"A0h\"),None)\n if tf is None:continue\n nd=struct.pack(\"<H\",tf)\n for ci in range(cs):\n  c_idx,_,_,_,_,_,cd,_=struct.unpack_from(\"<8I\",d,co+ci*32)\n  if cd==0:continue\n  p=cd;sf,p=uleb(d,p);inf,p=uleb(d,p);dm,p=uleb(d,p);vm,p=uleb(d,p)\n  for _ in range(sf+inf):_,p=uleb(d,p);_,p=uleb(d,p)\n  for mc in(dm,vm):\n   mi=0\n   for _ in range(mc):\n    df,p=uleb(d,p);mi+=df;_,p=uleb(d,p);cf,p=uleb(d,p)\n    if cf==0:continue\n    isz=struct.unpack_from(\"<I\",d,cf+12)[0]\n    ins=d[cf+16:cf+16+isz*2]\n    if nd not in ins:continue\n    ok=0;pos=0\n    while 1:\n     pos=ins.find(nd,pos)\n     if pos<0:break\n     if pos>=2 and pos%2==0 and 0x52<=ins[pos-2]<=0x6d:ok=1;break\n     pos+=2\n    if ok:\n     cn=gs(d,so,struct.unpack_from(\"<I\",d,to+c_idx*4)[0])\n     mn=gs(d,so,struct.unpack_from(\"<HHI\",d,mo+mi*8)[2])\n     print(os.path.basename(dp),cn+\"->\"+mn)\n     ms.append((dp,cn[1:-1].replace(\"/\",\".\")))\nseen=set();td=[]\nfor dp,cn in ms:\n if cn not in seen:seen.add(cn);td.append((dp,cn))\n if len(td)>=3:break\nfor i,(dp,cn) in enumerate(td):\n od=\"/tmp/jm\"+str(i)\n print(\"=== DECOMPILE\",cn,\"===\")\n subprocess.run([\"/tmp/jadx/bin/jadx\",\"--rename-flags\",\"none\",\"--single-class\",cn,\"-d\",od,dp])\n for r,_,fs in os.walk(od):\n  for fn in fs:\n   if fn.endswith(\".java\"):\n    lns=open(os.path.join(r,fn),errors=\"replace\").readlines()\n    for li,ln in enumerate(lns):\n     if \"00WG.A0h\" in ln:\n      for k in range(max(0,li-20),min(len(lns),li+21)):print(str(k+1)+\": \"+lns[k].rstrip())\n      break\n")'
