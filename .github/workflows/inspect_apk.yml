name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" classes.dex classes2.dex -d /tmp/dex
        /tmp/jadx/bin/jadx --single-class X.05yu --single-class p000X.C05yu -d /tmp/o1 /tmp/dex/classes.dex || true; echo "=== X.05yu ==="; find /tmp/o1 -name "*.java" -exec head -n 60 {} +; /tmp/jadx/bin/jadx --single-class X.02pg --single-class p000X.C02pg -d /tmp/o2 /tmp/dex/classes.dex || true; echo "=== X.02pg ==="; find /tmp/o2 -name "*.java" -exec grep -n -C 15 "572719583" {} +; /tmp/jadx/bin/jadx --single-class com.instagram.feed.media.Media -d /tmp/o3 /tmp/dex/classes2.dex || true; echo "=== Media ==="; find /tmp/o3 -name "*.java" -exec grep -n -E "08rX|A08|getInt" {} + | head -n 60; /tmp/jadx/bin/jadx --single-class X.08rX --single-class p000X.C08rX -d /tmp/o4 /tmp/dex/classes.dex /tmp/dex/classes2.dex || true; echo "=== X.08rX ==="; find /tmp/o4 -name "*.java" -exec grep -n -E "A6K|A6O|A6M" {} + | head -n 40
