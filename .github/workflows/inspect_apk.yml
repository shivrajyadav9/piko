name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
                mkdir -p /tmp/dex && unzip -q -o "$BASE_APK" "classes*.dex" -d /tmp/dex
                export DEXDUMP=$(command -v dexdump || find /usr/local/lib/android/sdk/build-tools -name dexdump 2>/dev/null | sort -V | tail -n 1)
                          python3 -c 'exec("import glob,os,re,subprocess\ndexdump=os.environ[\"DEXDUMP\"]\nfiles=sorted(glob.glob(\"/tmp/dex/classes*.dex\"))\nprint(\"DEX files:\",len(files),\"DEXDUMP:\",dexdump)\ntarget_classes=set()\ntarget_files=set()\nenum_matches=[]\nfor f in files:\n  p=subprocess.Popen([dexdump,\"-d\",f],stdout=subprocess.PIPE,text=True,errors=\"replace\")\n  c=m=t=None\n  h1=h2=False\n  def fl():\n    if c and m and h1 and h2 and len(enum_matches)<30: enum_matches.append((c,f\"{m}{t}\"))\n  for ln in p.stdout:\n    s=ln.lstrip()\n    if s.startswith(\"Class descriptor\"):\n      fl(); m=t=None; h1=h2=False\n      r=re.search(r\"\\x27([^\\x27]+)\\x27\",s); c=r.group(1) if r else None\n    elif re.match(r\"^#\\d+\\s*:\\s*\\(in \",s):\n      fl(); m=t=None; h1=h2=False\n    elif re.match(r\"^name\\s*:\",s):\n      r=re.search(r\"\\x27([^\\x27]+)\\x27\",s); m=r.group(1) if r else None\n    elif re.match(r\"^type\\s*:\",s):\n      r=re.search(r\"\\x27([^\\x27]+)\\x27\",s); t=r.group(1) if r else None\n    else:\n      if \"last_selected_feed_type\" in ln and c: target_classes.add(c); target_files.add(f)\n      if \"LX/03bi;\" in ln: h1=True\n      if \"FOLLOWING\" in ln or \"FOR_YOU\" in ln or \"MainFeedFragment\" in ln or \"fragment_feed\" in ln: h2=True\n  fl(); p.wait()\nprint(\"=== 1. CLASS WITH last_selected_feed_type ===\")\nsetters=set()\nfor f in sorted(target_files):\n  p=subprocess.Popen([dexdump,\"-d\",f],stdout=subprocess.PIPE,text=True,errors=\"replace\")\n  c=m=t=None\n  for ln in p.stdout:\n    s=ln.lstrip()\n    if s.startswith(\"Class descriptor\"):\n      r=re.search(r\"\\x27([^\\x27]+)\\x27\",s); c=r.group(1) if r else None\n      if c in target_classes: print(\"CLASS:\",c)\n    elif c in target_classes:\n      if re.match(r\"^name\\s*:\",s):\n        r=re.search(r\"\\x27([^\\x27]+)\\x27\",s); m=r.group(1) if r else None\n      elif re.match(r\"^type\\s*:\",s):\n        r=re.search(r\"\\x27([^\\x27]+)\\x27\",s); t=r.group(1) if r else None\n        print(\"  METHOD:\",f\"{m}{t}\")\n        if t==\"(Ljava/lang/String;)V\": setters.add(f\"{c}.{m}:{t}\")\n  p.wait()\nprint(\"=== CALLERS OF SETTER (Ljava/lang/String;)V ===\",setters)\ncnt=0\nfor f in files:\n  if not setters or cnt>=50: break\n  p=subprocess.Popen([dexdump,\"-d\",f],stdout=subprocess.PIPE,text=True,errors=\"replace\")\n  c=m=t=None\n  for ln in p.stdout:\n    s=ln.lstrip()\n    if s.startswith(\"Class descriptor\"):\n      r=re.search(r\"\\x27([^\\x27]+)\\x27\",s); c=r.group(1) if r else None; m=t=None\n    elif re.match(r\"^name\\s*:\",s):\n      r=re.search(r\"\\x27([^\\x27]+)\\x27\",s); m=r.group(1) if r else None\n    elif re.match(r\"^type\\s*:\",s):\n      r=re.search(r\"\\x27([^\\x27]+)\\x27\",s); t=r.group(1) if r else None\n    elif any(x in ln for x in setters):\n      print(f\"{c} -> {m}{t} | {s.strip()}\"); cnt+=1\n      if cnt>=50: break\n  p.wait()\nprint(\"=== 2. METHODS REFERENCING LX/03bi; + KEYWORDS (LIMIT 30) ===\")\nfor c,ms in enum_matches: print(f\"{c} -> {ms}\")\n")'
