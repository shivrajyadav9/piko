name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "*.dex" -d /tmp/dex
          python3 -c '
          import glob,os,re,subprocess;exec("dexes=sorted(glob.glob(\"/tmp/dex/*.dex\"))\ntargets=[b\"Lcom/instagram/user/follow/FollowButtonBase;\",b\"Lcom/instagram/user/follow/FollowButton;\",b\"Lcom/instagram/actionbar/ActionBarTitleViewSwitcher;\"]\nfor i,d in enumerate(dexes):\n data=open(d,\"rb\").read()\n hits=[t.decode() for t in targets if t in data]\n if hits:\n  print(\"MATCH:\",d,hits)\n  out=f\"/tmp/jadx_out_{i}\"\n  subprocess.run([\"/tmp/jadx/bin/jadx\",\"-d\",out,\"--no-res\",\"--no-imports\",d])\n  for n in [\"FollowButtonBase.java\",\"FollowButton.java\"]:\n   for p in glob.glob(out+\"/**/\"+n,recursive=True):\n    print(\"=== \"+p+\" ===\")\n    print(open(p).read()[:4000])\n  for p in glob.glob(out+\"/**/ActionBarTitleViewSwitcher.java\",recursive=True):\n   print(\"=== \"+p+\" ===\")\n   for l in open(p):\n    s=l.strip()\n    if (\"(\" in s and \"{\" in s and not s.startswith((\"if \",\"for \",\"while \",\"switch \",\"catch \"))) or \"A05\" in s or \"A06\" in s:\n     print(l.rstrip())\n")
          '
          
