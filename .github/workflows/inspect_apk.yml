name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
                /tmp/jadx/bin/jadx --rename-flags "none" --single-class X.08bl -d /tmp/jadx_out "$BASE_APK" || true; echo "=== 08bl.java ==="; cat /tmp/jadx_out/sources/X/08bl.java || true; /tmp/jadx/bin/jadx --rename-flags "none" --single-class X.03bi -d /tmp/jadx_out "$BASE_APK" || true; echo "=== 03bi.java ==="; cat /tmp/jadx_out/sources/X/03bi.java || true; /tmp/jadx/bin/jadx --rename-flags "none" --single-class com.instagram.ui.swipenavigation.container.SwipeNavigationContainer -d /tmp/jadx_out "$BASE_APK" || true; echo "=== SwipeNavigationContainer.java ==="; python3 -c 'lines=open("/tmp/jadx_out/sources/com/instagram/ui/swipenavigation/container/SwipeNavigationContainer.java").readlines(); [print("--- "+m+" ---\n"+"".join(lines[i:i+180])) for m in ("onInterceptTouchEvent","onTouchEvent") for i,l in enumerate(lines) if "boolean "+m in l and "(" in l]' || true
                DEXDUMP=$(find /usr/local/lib/android/sdk/build-tools -name dexdump 2>/dev/null | sort -V | tail -n 1); [ -z "$DEXDUMP" ] && (sudo apt-get update -qq && sudo apt-get install -y -qq dexdump) && DEXDUMP=dexdump; mkdir -p /tmp/dex /tmp/dd; unzip -q -o "$BASE_APK" "classes*.dex" -d /tmp/dex; for d in /tmp/dex/*.dex; do "$DEXDUMP" -d "$d" > "/tmp/dd/$(basename "$d").txt"; done
                python3 -c 'exec("import glob, re\nfiles = sorted(glob.glob(\"/tmp/dd/*.txt\"))\ndef dump(desc, mfn):\n  print(\"=== \" + desc + \" ===\")\n  for fn in files:\n    txt = open(fn, errors=\"replace\").read()\n    idx = txt.find(\"Class descriptor  : \\x27\" + desc + \"\\x27\")\n    if idx == -1: continue\n    s = txt.rfind(\"Class #\", 0, idx)\n    e = txt.find(\"\\nClass #\", idx)\n    blk = txt[s:e if e != -1 else len(txt)]\n    dm = blk.find(\"\\n  Direct methods\")\n    print(blk[:dm if dm != -1 else len(blk)])\n    if dm == -1: continue\n    for ch in re.split(r\"\\n    (?=#\\d)\", blk[dm:]):\n      nm = re.search(r\"name\\s*:\\s*\\x27([^\\x27]+)\\x27\", ch)\n      tp = re.search(r\"type\\s*:\\s*\\x27([^\\x27]+)\\x27\", ch)\n      sig = (nm.group(1) + tp.group(1)) if (nm and tp) else \"\"\n      if mfn(sig): print(ch)\n      elif sig: print(\"  METHOD: \" + sig)\ndump(\"Lcom/instagram/ui/swipenavigation/container/SwipeNavigationContainer;\", lambda s: (\"position\" in s.lower()) or (\"A03(Landroid/view/MotionEvent;)Z\" in s) or (\"onInterceptTouchEvent(Landroid/view/MotionEvent;)Z\" in s))\ndump(\"LX/08bl;\", lambda s: True)\nprint(\"=== INSTANTIATIONS OF LX/08bl; ===\")\nfor fn in files:\n  txt = open(fn, errors=\"replace\").read()\n  if \"LX/08bl;\" not in txt: continue\n  lines = txt.splitlines()\n  cls = \"\"; m = \"\"\n  for i, l in enumerate(lines):\n    if \"Class descriptor  :\" in l: cls = l.strip()\n    if \"      name          :\" in l: m = l.strip()\n    if \"new-instance\" in l and \"LX/08bl;\" in l:\n      print(cls, m)\n      for j in range(max(0, i-2), min(len(lines), i+6)): print(\" \", lines[j])\ndump(\"LX/03bi;\", lambda s: (\"<clinit>\" in s) or (\"A00(Ljava/lang/String;)LX/03bi;\" in s))")'
