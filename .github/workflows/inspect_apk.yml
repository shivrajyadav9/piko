name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex && unzip -q -o "$BASE_APK" "classes*.dex" -d /tmp/dex && DEXDUMP=$(command -v dexdump || find /usr/local/lib/android/sdk/build-tools -name dexdump 2>/dev/null | head -n1) && python3 -c 'import glob,os,re,subprocess,sys; exec("dd=sys.argv[1]\ntg=(\"LX/03cu;.A0D\",\"LX/03cu;.A0B\")\ntb=(\"LX/03cu;.A0C\",\"LX/03cu;.A08\",\"LX/03cu;.A0A\",\"LX/03cu;.A0F\")\nfs=sorted(glob.glob(\"/tmp/dex/classes*.dex\"),key=lambda p:(len(p),p))\nprint(\"DEX files:\",len(fs))\nfor f in fs:\n  out=subprocess.check_output([dd,\"-d\",f],text=True,errors=\"ignore\")\n  for c in out.split(\"Class descriptor  : \")[1:]:\n    cls=c.splitlines()[0].strip().strip(chr(39))\n    for m in re.split(r\"(?=^\\s+#\\d+\\s+: \\(in )\",c,flags=re.M)[1:]:\n      has_tg=any(x in m for x in tg)\n      has_tb=all(x in m for x in tb)\n      if not (has_tg or has_tb): continue\n      ls=m.splitlines()\n      name=next((l.split(\":\",1)[1].strip() for l in ls[:6] if \"name          :\" in l),\"\")\n      typ=next((l.split(\":\",1)[1].strip() for l in ls[:6] if \"type          :\" in l),\"\")\n      tag=(\"TG \" if has_tg else \"\")+(\"TB\" if has_tb else \"\")\n      print(f\"\\n=== [{tag}] {os.path.basename(f)} | {cls} | {name} {typ} ===\")\n      print(\"  03cu_refs:\",sorted(set(re.findall(r\"LX/03cu;\\.\\w+\",m))))\n      cw=[l.strip() for l in ls if \"const-wide\" in l and re.search(r\"(#|0x)8[123][0-9a-fA-F]+\",l)]\n      print(\"  mc_flags:\",cw)\n      if has_tb:\n        for l in ls:\n          if re.match(r\"^\\s*[0-9a-f]+:\\s\",l) or \"const-wide\" in l or \"LX/03cu;\" in l:\n            print(\"   \",l.strip())\n")' "$DEXDUMP"
