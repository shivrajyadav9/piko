name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "classes2.dex" "classes3.dex" "classes14.dex" -d /tmp/dex
          python3 -c 'exec("import struct,subprocess,os,glob\ndef uleb(d,p):\n r=s=0\n while 1:\n  b=d[p];p+=1;r|=(b&127)<<s\n  if not(b&128):return r,p\n  s+=7\ndef gs(d,so,i):\n o=struct.unpack_from(\"<I\",d,so+4*i)[0]\n _,p=uleb(d,o);return d[p:d.index(0,p)].decode(\"utf-8\",\"ignore\")\ndef fc(dp,ts):\n d=open(dp,\"rb\").read();sn,so=struct.unpack_from(\"<II\",d,0x38);tn,to=struct.unpack_from(\"<II\",d,0x40);cn,co=struct.unpack_from(\"<II\",d,0x60)\n ti={i for i in range(sn) if gs(d,so,i) in ts}\n print(\"FOUND_STRS\",dp,[gs(d,so,i) for i in ti]);res=set()\n for c in range(cn):\n  ci,_,_,_,_,_,cd,_=struct.unpack_from(\"<8I\",d,co+32*c)\n  if not cd:continue\n  sf,p=uleb(d,cd);inf,p=uleb(d,p);dm,p=uleb(d,p);vm,p=uleb(d,p)\n  for _ in range(sf+inf):_,p=uleb(d,p);_,p=uleb(d,p)\n  hit=0\n  for _ in range(dm+vm):\n   _,p=uleb(d,p);_,p=uleb(d,p);co2,p=uleb(d,p)\n   if co2:\n    ins=d[co2+16:co2+16+struct.unpack_from(\"<I\",d,co2+12)[0]*2]\n    for k in range(0,len(ins)-3,2):\n     if ins[k]==26 and struct.unpack_from(\"<H\",ins,k+2)[0] in ti:hit=1;break\n     if ins[k]==27 and k+5<len(ins) and struct.unpack_from(\"<I\",ins,k+2)[0] in ti:hit=1;break\n   if hit:break\n  if hit:\n   di=struct.unpack_from(\"<I\",d,to+4*ci)[0]\n   res.add(gs(d,so,di)[1:-1].replace(\"/\",\".\"))\n return sorted(res)\nfor dp,ts in [(\"/tmp/dex/classes2.dex\",{\"LITHO_MEDIA_HEADER\"}),(\"/tmp/dex/classes3.dex\",{\"LITHO_MEDIA_HEADER\"}),(\"/tmp/dex/classes14.dex\",{\"TALL_VIDEO\"})]:\n cs=fc(dp,ts);print(\"CLASSES\",dp,cs)\n outers=sorted({c.split(\"$\")[0] for c in cs})\n for c in outers:\n  od=\"/tmp/out/\"+os.path.basename(dp)+\"_\"+c;subprocess.run([\"/tmp/jadx/bin/jadx\",\"--rename-flags\",\"none\",\"--single-class\",c,\"-d\",od,dp])\n  for f in glob.glob(od+\"/**/*.java\",recursive=True):\n   lines=open(f,errors=\"ignore\").readlines();print(\"=== FILE:\",f,\"LINES:\",len(lines))\n   if len(lines)<=220:print(\"\".join(f\"{i+1}: {l}\" for i,l in enumerate(lines)))\n   else:\n    keep=set()\n    for i,l in enumerate(lines):\n     if any(k in l for k in (\"LITHO_MEDIA_HEADER\",\"TALL_VIDEO\",\"header\",\"Header\",\"overlay\",\"Overlay\")):\n      for j in range(max(0,i-25),min(len(lines),i+35)):keep.add(j)\n    for j in sorted(keep):print(f\"{j+1}: {lines[j]}\",end=\"\")\n")'
