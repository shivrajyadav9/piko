name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "classes2.dex" -d /tmp/dex
          export PATH="/tmp/jadx/bin:$PATH"; jadx --rename-flags "none" --single-class X.01j0 -d /tmp/o1 /tmp/dex/classes2.dex || true; jadx --rename-flags "none" --single-class X.03rF -d /tmp/o2 /tmp/dex/classes2.dex || true; python3 -c 'import glob; exec("def ext(p,fn):\n ls=open(p).readlines(); d=0; m=False; b=[]\n for i,l in enumerate(ls,1):\n  if not m and d==1 and (\"(\" in l or b):\n   b.append(f\"{i}: {l}\")\n   if \"{\" in l: d+=l.count(\"{\")-l.count(\"}\"); m=True\n   elif \";\" in l: b=[]\n  elif m:\n   b.append(f\"{i}: {l}\"); d+=l.count(\"{\")-l.count(\"}\")\n   if d<=1:\n    t=\"\".join(b)\n    if fn(t): print(t)\n    b=[]; m=False\n  else: d+=l.count(\"{\")-l.count(\"}\")\nprint(\"=== X.01j0 buildRowViewTypes ===\")\n[ext(p,lambda t:\"buildRowViewTypes\" in t) for p in glob.glob(\"/tmp/o1/**/*01j0.java\",recursive=True)]\nprint(\"=== X.03rF matching methods ===\")\n[ext(p,lambda t:any(k in t for k in (\"00WG.A0h\",\"00WG.A0W\",\"00WG.A0a\"))) for p in glob.glob(\"/tmp/o2/**/*03rF.java\",recursive=True)]")'
