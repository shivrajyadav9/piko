name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "classes*.dex" -d /tmp/dex
          python3 -c 'exec("import glob,os,struct,subprocess\ndef uleb(b,p):\n r=s=0\n while 1:\n  c=b[p];p+=1;r|=(c&127)<<s\n  if c<128:return r,p\n  s+=7\ndef ilen(d,b,pc):\n u=struct.unpack_from(\"<H\",d,b+pc*2)[0];op=u&255\n if op==0:\n  if u==256:return struct.unpack_from(\"<H\",d,b+(pc+1)*2)[0]*2+4\n  if u==512:return struct.unpack_from(\"<H\",d,b+(pc+1)*2)[0]*4+2\n  if u==768:return(struct.unpack_from(\"<H\",d,b+(pc+1)*2)[0]*struct.unpack_from(\"<I\",d,b+(pc+2)*2)[0]+1)//2+4\n  return 1\n if op in(1,4,7,10,11,12,13,14,15,16,17,18,29,30,33,39,40,115,121,122)or 62<=op<=67 or 123<=op<=143 or 176<=op<=207 or 227<=op<=249:return 1\n if op in(2,5,8,19,21,22,25,26,28,31,32,34,35,41,254,255)or 45<=op<=61 or 68<=op<=109 or 144<=op<=175 or 208<=op<=226:return 2\n if op in(3,6,9,20,23,27,36,37,38,42,43,44,252,253)or 110<=op<=114 or 116<=op<=120:return 3\n if op in(250,251):return 4\n if op==24:return 5\n return 1\nM=[]\nfor dp in sorted(glob.glob(\"/tmp/dex/classes*.dex\")):\n d=open(dp,\"rb\").read()\n if b\"LX/00WG;\" not in d:continue\n ssz,soff,tsz,toff,_,_,fsz,foff,msz,moff,csz,coff=struct.unpack_from(\"<12I\",d,56)\n def gs(i):\n  o=struct.unpack_from(\"<I\",d,soff+i*4)[0];_,p=uleb(d,o);return d[p:d.index(0,p)].decode(\"utf-8\",\"replace\")\n def gt(i):return gs(struct.unpack_from(\"<I\",d,toff+i*4)[0])\n wt=next((i for i in range(tsz) if gt(i)==\"LX/00WG;\"),None)\n if wt is None:continue\n tf={}\n for i in range(fsz):\n  ci,ti,ni=struct.unpack_from(\"<HHI\",d,foff+i*8)\n  if ci==wt and ti==wt:\n   nm=gs(ni)\n   if nm in(\"A0a\",\"A0V\"):tf[i]=nm\n if not tf:continue\n for i in range(csz):\n  ci,_,_,_,_,_,cdo,_=struct.unpack_from(\"<8I\",d,coff+i*32)\n  if cdo==0:continue\n  p=cdo;sf,p=uleb(d,p);inf,p=uleb(d,p);dm,p=uleb(d,p);vm,p=uleb(d,p)\n  for _ in range(sf+inf):_,p=uleb(d,p);_,p=uleb(d,p)\n  for cnt in(dm,vm):\n   mid=0\n   for _ in range(cnt):\n    df,p=uleb(d,p);mid+=df;_,p=uleb(d,p);co,p=uleb(d,p)\n    if co==0:continue\n    isz=struct.unpack_from(\"<I\",d,co+12)[0];b=co+16;pc=0\n    while pc<isz:\n     op=struct.unpack_from(\"<H\",d,b+pc*2)[0]&255\n     if 82<=op<=109:\n      fid=struct.unpack_from(\"<H\",d,b+(pc+1)*2)[0]\n      if fid in tf:M.append((dp,gt(ci),gs(struct.unpack_from(\"<HHI\",d,moff+mid*8)[2]),tf[fid]))\n     pc+=ilen(d,b,pc)\nprint(\"Total matches:\",len(M))\nfor dp,cd,mn,fl in M:print(os.path.basename(dp),cd+\"->\"+mn,\"00WG.\"+fl)\nseen=[]\nfor dp,cd,_,_ in M:\n c=cd[1:-1].replace(\"/\",\".\")\n if c in(\"X.00WG\",\"X.00WE\") or c.startswith((\"X.00WG$\",\"X.00WE$\")):continue\n if(dp,c)not in seen:seen.append((dp,c))\n if len(seen)>=4:break\nfor idx,(dp,c) in enumerate(seen):\n od=\"/tmp/out_\"+str(idx);os.makedirs(od,exist_ok=True);print(\"=== Decompiling\",c,\"from\",os.path.basename(dp),\"===\")\n subprocess.run([\"/tmp/jadx/bin/jadx\",\"--rename-flags\",\"none\",\"--single-class\",c,\"-d\",od,dp],check=False)\n for r,_,fs in os.walk(od):\n  for fn in fs:\n   if fn.endswith(\".java\"):\n    fp=os.path.join(r,fn);ls=open(fp,errors=\"replace\").readlines();print(\"FILE:\",fp,len(ls),\"lines\")\n    for li,ln in enumerate(ls):\n     if \"00WG.A0a\" in ln or \"00WG.A0V\" in ln:\n      s=max(0,li-20);e=min(len(ls),li+20);print(\"--- lines\",s+1,\"-\",e,\"---\")\n      for k in range(s,e):print(f\"{k+1}: {ls[k]}\",end=\"\")")'
          
