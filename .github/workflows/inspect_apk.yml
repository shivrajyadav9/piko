name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "classes2.dex" -d /tmp/dex
          export PATH="/tmp/jadx/bin:$PATH"; jadx --rename-flags "none" --single-class X.03rF -d /tmp/o1 /tmp/dex/classes2.dex || true; jadx --rename-flags "none" --single-class X.00NT -d /tmp/o2 /tmp/dex/classes2.dex || true; python3 -c 'import glob, re; exec("for g, ms in [(\"/tmp/o1/**/*.java\", [\"A04\",\"A05\",\"A07\",\"A08\",\"A09\"]), (\"/tmp/o2/**/*.java\", [\"A0D\"])]:\n fs=glob.glob(g, recursive=True)\n print(\"=== FILES:\", fs)\n if not fs: continue\n ls=open(fs[0]).read().splitlines()\n i=0\n while i<len(ls):\n  if re.search(r\"^\\s{1,8}[^/].*\\b(\"+\"|\".join(ms)+r\")\\s*\\(\", ls[i]) and not ls[i].strip().endswith(\";\"):\n   d=0; sb=False; print(f\"--- METHOD AT {i+1} ---\")\n   while i<len(ls):\n    if \"{\" in ls[i]: sb=True\n    d+=ls[i].count(\"{\")-ls[i].count(\"}\")\n    print(f\"{i+1}: {ls[i]}\")\n    i+=1\n    if sb and d<=0: break\n  else: i+=1\n for k, l in enumerate(ls, 1):\n  if any(x in l for x in [\"00WG.A0a\",\"00WG.A0r\",\"00WG.A0g\",\"00WG.A0h\",\"00WG.A0W\"]):\n   print(f\"REF {k}: {l}\")\n")'
