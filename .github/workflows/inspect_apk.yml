name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "classes2.dex" "classes3.dex" -d /tmp/dex
          DEXDUMP=$(command -v dexdump || find /usr/local/lib/android/sdk/build-tools -name dexdump 2>/dev/null | sort -V | tail -n 1)
          python3 -c 'import subprocess,sys; exec("""\nfor dex in ("classes2.dex","classes3.dex"):\n p=subprocess.Popen([sys.argv[1],"-d",f"/tmp/dex/{dex}"],stdout=subprocess.PIPE,text=True,errors="replace")\n cls=name=sig=""; h08=h075=False; cs=[]\n def flush():\n  if h08 and h075:\n   print(f"[{dex}] {cls} -> {name}{sig}")\n   for c in cs: print(" ",c)\n for line in p.stdout:\n  s=line.strip()\n  if s.startswith("Class descriptor"): flush(); cls=s.split("\x27",2)[1] if "\x27" in s else s; name=sig=""; h08=h075=False; cs=[]\n  elif s.startswith("#") and ": (in " in s: flush(); name=sig=""; h08=h075=False; cs=[]\n  elif s.startswith("name") and ":" in s and not name: name=s.split("\x27",2)[1] if "\x27" in s else s\n  elif s.startswith("type") and ":" in s and not sig: sig=s.split("\x27",2)[1] if "\x27" in s else s\n  elif "|" in line:\n   r=line.split("|",1)[1]\n   if "const" in r:\n    if "3f4ccccd" in r: h08=True\n    if "3f40" in r: h075=True\n    if "3f4ccccd" in r or "3f40" in r or "17fe7936" in r: cs.append(r.strip())\n flush(); p.wait()\n""")' "$DEXDUMP"
