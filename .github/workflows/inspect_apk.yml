name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
          mkdir -p /tmp/dex
          unzip -q -o "$BASE_APK" "*.dex" -d /tmp/dex
          python3 -c '
          import glob,os,re,struct,subprocess;exec("def get_classes(data):\n    so_cnt,so_off=struct.unpack_from(\"<II\",data,56)\n    to_cnt,to_off=struct.unpack_from(\"<II\",data,64)\n    cd_cnt,cd_off=struct.unpack_from(\"<II\",data,96)\n    def get_str(idx):\n        p=struct.unpack_from(\"<I\",data,so_off+4*idx)[0]\n        while data[p]&0x80:p+=1\n        p+=1\n        return data[p:data.index(0,p)].decode(\"utf-8\",\"replace\")\n    res=set()\n    for i in range(cd_cnt):\n        cidx=struct.unpack_from(\"<I\",data,cd_off+32*i)[0]\n        sidx=struct.unpack_from(\"<I\",data,to_off+4*cidx)[0]\n        res.add(get_str(sidx))\n    return res\ndexes=sorted(glob.glob(\"/tmp/dex/*.dex\"))\nprint(\"DEX_COUNT:\",len(dexes))\ndex_data={d:open(d,\"rb\").read() for d in dexes}\ndex_classes={d:get_classes(dex_data[d]) for d in dexes}\ndecompiled={}\ndef decompile_dex(d):\n    if d not in decompiled:\n        out=\"/tmp/out_\"+os.path.basename(d)\n        subprocess.run([\"/tmp/jadx/bin/jadx\",\"--no-res\",\"-j\",\"4\",\"-d\",out,d],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)\n        decompiled[d]=out\n    return decompiled[d]\ndef show_target(title,strs):\n    print(\"=== \"+title+\" ===\")\n    qstrs=[chr(34)+s+chr(34) for s in strs]\n    for d in dexes:\n        b=dex_data[d]\n        if all(s.encode() in b for s in strs):\n            print(\"Matched DEX:\",d)\n            out=decompile_dex(d)\n            for root,_,files in os.walk(out):\n                for f in files:\n                    if f.endswith(\".java\"):\n                        p=os.path.join(root,f)\n                        txt=open(p,errors=\"ignore\").read()\n                        if all(qs in txt for qs in qstrs):\n                            print(\"FILE:\",p)\n                            lines=txt.splitlines()\n                            print(\"\\n\".join(lines[:400]))\n                            if len(lines)>400:print(\"...TRUNCATED...\")\nshow_target(\"TARGET1_FEEDITEM\",[\"media_or_ad\",\"explore_story\",\"clips_netego\"])\nshow_target(\"TARGET2_HOMEFEED\",[\"pull_to_refresh_window_ms\",\"feed_items\"])\nshow_target(\"TARGET3_MEDIAPARSER\",[\"original_width\",\"original_height\",\"media_type\",\"product_type\"])\nfor desc in [\"Lcom/instagram/mainfeed/network/FeedMediaCache;\",\"Lcom/instagram/feed/media/Media;\",\"Lcom/instagram/feed/media/MediaData;\"]:\n    print(\"=== CLASS_DEF: \"+desc+\" ===\")\n    cls_name=desc[1:-1].replace(\"/\",\".\")\n    for d in dexes:\n        if desc in dex_classes[d]:\n            print(\"Defined in:\",d)\n            out=\"/tmp/out_cls_\"+cls_name.split(\".\")[-1]\n            subprocess.run([\"/tmp/jadx/bin/jadx\",\"--no-res\",\"-j\",\"4\",\"--single-class\",cls_name,\"-d\",out,d],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)\n            jp=os.path.join(out,\"sources\",desc[1:-1]+\".java\")\n            if os.path.exists(jp):\n                lines=open(jp,errors=\"ignore\").read().splitlines()\n                print(\"FILE:\",jp,\"LINES:\",len(lines))\n                if len(lines)<=450:\n                    print(\"\\n\".join(lines))\n                else:\n                    pat_s=r\"(class |interface |FeedItem|Media|feed|cache|store|public |private |protected )\" if \"FeedMediaCache\" in desc else r\"(class |interface |MediaData|media_type|MediaType|product_type|ProductType|original_width|OriginalWidth|original_height|OriginalHeight|isVideo|isClips|isCarousel|getAspectRatio|AspectRatio)\"\n                    pat=re.compile(pat_s)\n                    shown=set()\n                    for idx,ln in enumerate(lines):\n                        if idx<40 or pat.search(ln):\n                            for k in range(max(0,idx-1),min(len(lines),idx+3)):\n                                if k not in shown:\n                                    shown.add(k)\n                                    print(str(k+1)+\": \"+lines[k])")
          '
          
