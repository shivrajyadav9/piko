name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Android package name'
        required: true
        default: 'com.instagram.android'
      version:
        description: 'Target version name (or empty for latest)'
        required: false
        default: '452.1.0.53.64'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup tools
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          curl -sL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Download APK
        run: |
          mkdir -p /tmp/apk /tmp/extracted
          /tmp/apkeep -a "${{ inputs.package_id }}@${{ inputs.version }}" -d apk-pure -o 'acknowledge_dangers=true' /tmp/apk
          for f in /tmp/apk/*.xapk /tmp/apk/*.apkm; do [ -f "$f" ] && unzip -q -o "$f" -d /tmp/extracted; done || true
          for f in /tmp/apk/*.apk; do [ -f "$f" ] && cp "$f" /tmp/extracted/base.apk; done || true

      - name: Inspect resources and DEX
        run: |
          BASE_APK=$(find /tmp/extracted -maxdepth 2 -name "*.apk" -exec sh -c 'unzip -l "$1" | grep -q "classes.dex" && echo "$1"' _ {} \; | head -n 1)
                  DEXDUMP=$(find /usr/local/lib/android/sdk/build-tools -name dexdump 2>/dev/null | sort -V | tail -n 1); [ -z "$DEXDUMP" ] && sudo apt-get update -qq && sudo apt-get install -y -qq dexdump || true; mkdir -p /tmp/dex /tmp/jadx_out && unzip -q -o "$BASE_APK" "classes*.dex" -d /tmp/dex && (/tmp/jadx/bin/jadx --rename-flags "none" --single-class X.0JBl -d /tmp/jadx_out "$BASE_APK" || true) && python3 -c 'import subprocess, glob; dds = subprocess.getoutput("find /usr/local/lib/android/sdk/build-tools -name dexdump 2>/dev/null | sort -V | tail -n 1").strip() or "dexdump"; dexs = sorted(glob.glob("/tmp/dex/classes*.dex")); tgts = ["A07:(IZ)V", "0SHs", "0SHj", "A1L", "08T8"]; [print("0JBl in:", d) for d in dexs if subprocess.run(["grep", "-q", "0JBl", d]).returncode == 0]; exec("for d in dexs:\n if \"classes2.dex\" not in d and subprocess.run([\"grep\",\"-q\",\"07AW\",d]).returncode!=0: continue\n p=subprocess.Popen([dds,\"-d\",d],stdout=subprocess.PIPE,text=True,errors=\"replace\")\n ic=im=False; buf=[]\n for ln in p.stdout:\n  if \"Class descriptor\" in ln:\n   if im: break\n   ic=\"LX/07AW;\" in ln\n  elif ic and \"name\" in ln and \"onViewCreated\" in ln:\n   im=True; buf.append(ln.rstrip())\n  elif im:\n   if ln.startswith(\"    #\") or \"Direct methods\" in ln or \"Virtual methods\" in ln: break\n   buf.append(ln.rstrip())\n p.terminate()\n if buf:\n  print(\"=== X.07AW.onViewCreated in\", d, len(buf))\n  for i,l in enumerate(buf):\n   if any(t in l for t in tgts):\n    print(\"--- MATCH\", i)\n    for j in range(max(0,i-15), min(len(buf),i+16)): print(f\"{j}: {buf[j]}\")\nfor f in glob.glob(\"/tmp/jadx_out/**/*.java\", recursive=True):\n print(\"=== JADX:\", f)\n ls=open(f,errors=\"replace\").read().splitlines()\n for i,l in enumerate(ls):\n  if any(k in l for k in [\"case 33\",\"case 34\",\"0SHs\",\"0SHj\"]):\n   print(\"--- JADX MATCH\", i)\n   for j in range(max(0,i-15), min(len(ls),i+16)): print(f\"{j}: {ls[j]}\")")'
